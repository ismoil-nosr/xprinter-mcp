name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xprinter-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
      - name: Check out pinned native renderer
        if: runner.os == 'macOS'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ismoil-nosr/xprinter-macos
          ref: 90aa6db09dbfd7467048261cb2abe386d94bb244 # Open Xprinter 0.3.0 renderer
          path: native-driver
          persist-credentials: false
      - name: Build native companion without installing or printing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./native-driver/scripts/build.sh
          printf 'XPRINTER_RENDERER=%s/native-driver/build/stage/Applications/Open Xprinter.app/Contents/MacOS/OpenXprinter\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Test protocol, authorization, retry safety and native integration
        run: npm test
      - name: Test clean installation of runtime archive
        run: npm run test:package
      - name: Upload runtime archive
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: xprinter-mcp-runtime
          path: '*.tgz'
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: xprinter-mcp-runtime
          path: release-artifacts
      - name: Publish runtime and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Open Xprinter MCP $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/docs/RELEASE-NOTES.md"
