name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xprinter-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
      - name: Check out pinned native renderer
        if: runner.os == 'macOS'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ismoil-nosr/xprinter-macos
          ref: 90aa6db09dbfd7467048261cb2abe386d94bb244 # Open Xprinter 0.3.0 renderer
          path: native-driver
          persist-credentials: false
      - name: Build native companion without installing or printing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./native-driver/scripts/build.sh
          printf 'XPRINTER_RENDERER=%s/native-driver/build/stage/Applications/Open Xprinter.app/Contents/MacOS/OpenXprinter\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Test protocol, authorization, retry safety and native integration
        run: npm test
      - name: Test clean installation of runtime archive
        run: npm run test:package
      - name: Upload runtime archive
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: xprinter-mcp-runtime
          path: '*.tgz'
          if-no-files-found: error
  docker-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install test client dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Build production image
        run: docker build --tag xprinter-mcp:docker-test .
      - name: Test image over real SSH without access to a physical printer
        run: npm run test:docker
      - name: Validate Compose including HTTP profile
        run: docker compose --env-file docker.env.example --profile http config --quiet
  image:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, docker-test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, docker-test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: xprinter-mcp-runtime
          path: release-artifacts
      - name: Publish runtime and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p docker-quickstart/docs docker-quickstart/examples
          cp compose.yaml docker.env.example LICENSE docker-quickstart/
          cp examples/* docker-quickstart/examples/
          cp docs/*.md docker-quickstart/docs/
          cp README.md SECURITY.md CONTRIBUTING.md docker-quickstart/
          version="${GITHUB_REF_NAME#v}"
          (cd docker-quickstart && zip -qr "../release-artifacts/xprinter-docker-${version}.zip" .)
          cd release-artifacts
          printf 'ghcr.io/%s@%s\n' "$GITHUB_REPOSITORY" "$IMAGE_DIGEST" > IMAGE-DIGEST.txt
          sha256sum ./*.tgz ./*.zip IMAGE-DIGEST.txt > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./*.tgz ./*.zip IMAGE-DIGEST.txt SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Open Xprinter MCP $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/docs/RELEASE-NOTES.md"
